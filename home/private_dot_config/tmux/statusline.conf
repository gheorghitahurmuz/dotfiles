# vim: ft=tmux

# ── Palette ─────────────────────────────────────────────────────────
# Single source of truth for every colour. Change here to retheme.
set -g @col_bg          "default"   # terminal background
set -g @col_fg          "#666666"   # base fg / session base / inter-window bullets
set -g @col_dim         "#353535"   # inactive window text
set -g @col_bright      "#bbbbbb"   # active window text
set -g @col_divider     "#1e1e1e"   # │ divider between session and window list
set -g @col_prefix      "#95E6CB"   # accent: session name while prefix held (teal)
set -g @col_ssh         "#E6B450"   # accent: ssh icon on active window (amber)
set -g @col_zoom        "#39BAE6"   # accent: zoom icon on active window (blue)
set -g @col_pane_border "#222222"   # inactive pane border
set -g @col_pane_active "#444444"   # active pane border + border-format text

# ── Status bar basics ───────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
# Style strings don't always expand #{@vars}, so keep literals here.
# (Mirror @col_fg above.)
set -g status-style "bg=default,fg=#666666"

# ── Pane borders ────────────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-indicators   off
# (Mirror @col_pane_border / @col_pane_active above.)
set -g pane-border-style        "fg=#222222"
set -g pane-active-border-style "fg=#444444"

# Default pane label: "main" for pane 1, "pane N" otherwise.
# If pane_title was changed (e.g. via prefix+r), show that instead.
set -g pane-border-format "#[fg=#{@col_pane_active}] #{?#{==:#{pane_title},#h},#{?#{==:#{pane_index},1},main,pane #{pane_index}},#{pane_title}} "

set -g status-right ""

set -g status 2
set -g status-format[0] ""

# ── Status format (line 1) ──────────────────────────────────────────
# Layout:
#   <session> │ <win> • <win> • <win>
# - <session> is bold; turns @col_prefix while prefix is held
# - " • " separates windows; suppressed before window_index == 1
# - 󰌘 shown when the pane runs ssh   (coloured @col_ssh on active window)
# - 󰊓 shown when window is zoomed     (coloured @col_zoom on active window)
#
# Inlined as one format string because tmux doesn't recursively expand
# nested #{@var} references in this version.
set -g status-format[1] "#[fg=#{?client_prefix,#{@col_prefix},#{@col_fg}},bold]#S #[fg=#{@col_divider},nobold] │#{W:#{?#{==:#{window_index},1},,#[fg=#{@col_fg}] •}#[fg=#{@col_dim}] #I #{?#{==:#{pane_current_command},ssh},󰌘 ,}#W#{?window_zoomed_flag, 󰊓,},#{?#{==:#{window_index},1},,#[fg=#{@col_fg}] •}#[fg=#{@col_bright},bg=#{@col_bg}] #I #{?#{==:#{pane_current_command},ssh},#[fg=#{@col_ssh}]󰌘#[fg=#{@col_bright}] ,}#W#{?window_zoomed_flag, #[fg=#{@col_zoom}]󰊓#[fg=#{@col_bright}],}}#[align=right]#[fg=#{@col_fg}]#{?#{==:#{continuum_status},off},off,●}"
